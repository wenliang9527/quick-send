[package]
name = "quick-send-server"
version = "0.5.1"
edition = "2021"
description = "Quick-Send MCP App 后端（Rust 原生版）：stdio JSON-RPC + snippets 存储 + 剪贴板"

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
base64 = "0.22"
chrono = "0.4"

# 体积优先：静态单 exe，目标 ~2MB、常驻 RSS ~3-5MB
[profile.release]
opt-level = "z"
lto = true
strip = true
codegen-units = 1
panic = "abort"
